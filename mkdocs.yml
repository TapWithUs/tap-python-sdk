site_name: Tap Python SDK
site_description: BLE SDK documentation for Tap Strap and TapXR
site_url: https://tapwithus.github.io/tap-python-sdk/
site_author: Tap Systems Inc.

repo_name: TapWithUs/tap-python-sdk
repo_url: https://github.com/TapWithUs/tap-python-sdk
edit_uri: edit/master/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/TapWithUs/tap-python-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tap-python-sdk/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - v1 (TapSDK):
      - Overview: v1/index.md
      - Tutorial:
          - Getting started: v1/tutorial/getting-started.md
      - How-to guides:
          - Overview: v1/how-to/index.md
          - Install the SDK: how-to/install.md
          - Connect and listen: v1/how-to/connect-and-listen.md
          - Switch input modes: v1/how-to/switch-input-modes.md
          - Stream raw sensors: v1/how-to/stream-raw-sensors.md
          - Send haptics: v1/how-to/send-haptics.md
          - Use Spatial Control: v1/how-to/use-spatial-control.md
          - Migrate from 0.6: v1/how-to/migrate-from-0.6.md
      - Reference:
          - Overview: v1/reference/index.md
          - TapSDK: v1/reference/tapsdk.md
          - Input modes: v1/reference/input-modes.md
          - Events: v1/reference/events.md
          - Enumerations: reference/enumerations.md
          - Package: reference/package.md
      - Explanation:
          - Overview: v1/explanation/index.md
          - Connection model: v1/explanation/connection-model.md
          - Input modes: v1/explanation/input-modes.md
          - Raw sensors: v1/explanation/raw-sensors.md
  - v2 (TapSDK2):
      - Overview: v2/index.md
      - Tutorial:
          - Getting started: v2/tutorial/getting-started.md
      - How-to guides:
          - Overview: v2/how-to/index.md
          - Install the SDK: how-to/install.md
          - Connect and listen: v2/how-to/connect-and-listen.md
          - Use features: v2/how-to/use-features.md
          - Send haptics: v2/how-to/send-haptics.md
      - Reference:
          - Overview: v2/reference/index.md
          - TapSDK2: v2/reference/tapsdk2.md
          - Events: v2/reference/events.md
          - Enumerations: reference/enumerations.md
          - Package: reference/package.md
      - Explanation:
          - Overview: v2/explanation/index.md
          - Connection model: v2/explanation/connection-model.md
          - Features model: v2/explanation/features.md
  - Release notes: release-notes.md
