name: Tests

# Reusable lint + test matrix. Single source of truth called by the CI workflow
# (on PRs and pushes to master) and by the Publish workflow (on tags), so the
# matrix is defined once and publish is gated on the same tests (#39).

on:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 examples tapsdk tests
      - name: Run tests
        run: pytest -v
